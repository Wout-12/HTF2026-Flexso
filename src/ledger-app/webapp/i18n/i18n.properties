# Why is this here
why=Why is this here?
rImpossibleFlow=The sensor says {0} litres a minute, while the pipe is built for {1}. More than double is a number that can''t be true.
rNegativeStock=The pantry says {0} {1} of {2}. You can''t have less than nothing.
rContradiction=The pipe and its own sensor tell different stories: the sensor says {0}, the pipe says {1}. That is more than a fifth of the {2} the pipe is built for.
rNightCreated=It was created at {0} at night, when nobody works.
rNightChanged=It was last changed at {0} at night, when nobody works.
rNotPerson=It was written under the name "{0}", which isn''t a villager.
rFutureRepair=It is dated {0}, a day that hasn''t come yet. It could be planned work or a wrong date, so that part needs confirming. (A check our team added.)
rAttribution=It names {0} as the repairer while "{1}" wrote it down. That proves nothing on its own, but it is worth asking {0}.
rOutsideCreated={0} put it in the records, and this is usually {1}''s work. Worth asking them both.
rOutsideChanged={0} last changed it on {1}, and this is usually {2}''s work. Worth asking them both.
rCouncilChanged=It was last changed on {0} under the shared council account, so we can''t tell which person did it. Rowan said the council shouldn''t touch Tobin''s numbers. Worth asking the council.
rAlone=On the other {0} pipes, whoever last updated the pipe also updated its sensor within five minutes. This sensor was changed on its own.
tolerance=We call it a contradiction from more than a fifth of the design flow apart. A cautious first choice of ours, until Maren tells us what an ordinary day looks like.

